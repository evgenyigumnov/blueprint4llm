<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460"><title>Balsamiq mockup</title><rect class="balsamiq-canvas" x="0" y="0" width="360" height="460" fill="#ffffff"></rect><g class="balsamiq-control balsamiq-control--title" data-control-id="1"><title>1</title><text x="24" y="28.25" fill="#1f2937" font-family="Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="24" dy="0">Sign in</tspan></text></g><g class="balsamiq-control balsamiq-control--label" data-control-id="2"><title>2</title><text x="24" y="89.25" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="24" dy="0">Email address</tspan></text></g><g class="balsamiq-control balsamiq-control--textinput" data-control-id="3"><title>3</title><rect x="24" y="112" width="312" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"></rect><text x="32" y="125.25" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="32" dy="0">name@example.com</tspan></text></g><g class="balsamiq-control balsamiq-control--label" data-control-id="4"><title>4</title><text x="24" y="177.25" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="24" dy="0">Password</tspan></text></g><g class="balsamiq-control balsamiq-control--textinput" data-control-id="5"><title>5</title><rect x="24" y="200" width="312" height="44" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"></rect><text x="32" y="213.25" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="32" dy="0">••••••••</tspan></text></g><g class="balsamiq-control balsamiq-control--button" data-control-id="6"><title>6</title><rect x="24" y="280" width="312" height="48" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"></rect><text x="180" y="295.25" fill="#111827" font-family="Arial, sans-serif" font-size="14" font-weight="500" font-style="normal" text-anchor="middle" dominant-baseline="hanging"><tspan x="180" dy="0">Continue</tspan></text></g></svg>