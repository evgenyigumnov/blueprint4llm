ol--combobox" data-control-id="priority"><title>priority</title><rect x="288" y="88" width="150" height="36" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"></rect><path d="M412 89 V123 M420 104 l5 5 l5 -5" fill="none" stroke="#64748b" stroke-width="1.5"></path><text x="296" y="97.25" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="296" dy="0">Priority: all</tspan></text></g><g class="balsamiq-control balsamiq-control--combobox" data-control-id="status"><title>status</title><rect x="452" y="88" width="130" height="36" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"></rect><path d="M556 89 V123 M564 104 l5 5 l5 -5" fill="none" stroke="#64748b" stroke-width="1.5"></path><text x="460" y="88.5" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="460" dy="0">Status:</tspan><tspan x="460" dy="17.5">open</tspan></text></g><g class="balsamiq-control balsamiq-control--checkbox" data-control-id="mine"><title>mine</title><rect x="596" y="99" width="16" height="16" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="1.5"></rect><path d="M599.2 107.32 l3.52 3.52 l6.72 -7.68" fill="none" stroke="#2563eb" stroke-width="2"></path><text x="618" y="100" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="618" dy="0">Assigned to my team</tspan></text></g><g class="balsamiq-control balsamiq-control--rectangle" data-control-id="queue-panel"><title>queue-panel</title><rect x="20" y="144" width="492" height="376" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"></rect></g><g class="balsamiq-control balsamiq-control--label" data-control-id="queue-title"><title>queue-title</title><text x="34" y="157.13" fill="#1f2937" font-family="Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="34" dy="0">Needs attention · oldest first</tspan></text></g><g class="balsamiq-control balsamiq-control--rectangle" data-control-id="ticket-1"><title>ticket-1</title><rect x="30" y="190" width="472" height="60" fill="#fff7ed" stroke="#64748b" stroke-width="1.5"></rect><text x="266" y="203.75" fill="#1f2937" font-family="Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" dominant-baseline="hanging"><tspan x="266" dy="0">CS-4821 · Webhook retries doubled</tspan><tspan x="266" dy="16.25">Growth plan · Mira K. · 14 min ago · SLA 18 min</tspan></text></g><g class="balsamiq-control balsamiq-control--rectangle" data-control-id="ticket-2"><title>ticket-2</title><rect x="30" y="256" width="472" height="60" fill="#ffffff" stroke="#64748b" stroke-width="1.5"></rect><text x="266" y="269.75" fill="#1f2937" font-family="Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" dominant-baseline="hanging"><tspan x="266" dy="0">CS-4817 · Invoice export is blank</tspan><tspan x="266" dy="16.25">Scale plan · Noel R. · 31 min ago · SLA 42 min</tspan></text></g><g class="balsamiq-control balsamiq-control--rectangle" data-control-id="ticket-3"><title>ticket-3</title><rect x="30" y="322" width="472" height="60" fill="#ffffff" stroke="#64748b" stroke-width="1.5"></rect><text x="266" y="335.75" fill="#1f2937" font-family="Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" dominant-baseline="hanging"><tspan x="266" dy="0">CS-4809 · Cannot add a second workspace</tspan><tspan x="266" dy="16.25">Starter plan · Eli T. · 53 min ago</tspan></text></g><g class="balsamiq-control balsamiq-control--rectangle" data-control-id="ticket-4"><title>ticket-4</title><rect x="30" y="388" width="472" height="60" fill="#ffffff" stroke="#64748b" stroke-width="1.5"></rect><text x="266" y="401.75" fill="#1f2937" font-family="Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" dominant-baseline="hanging"><tspan x="266" dy="0">CS-4798 · SSO redirect loops on Safari</tspan><tspan x="266" dy="16.25">Enterprise · Jo S. · 1 h ago</tspan></text></g><g class="balsamiq-control balsamiq-control--rectangle" data-control-id="ticket-5"><title>ticket-5</title><rect x="30" y="454" width="472" height="54" fill="#ffffff" stroke="#64748b" stroke-width="1.5"></rect><text x="266" y="464.75" fill="#1f2937" font-family="Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" text-anchor="middle" dominant-baseline="hanging"><tspan x="266" dy="0">CS-4786 · Usage report differs from dashboard</tspan><tspan x="266" dy="16.25">Growth plan · Sam P. · 2 h ago</tspan></text></g><g class="balsamiq-control balsamiq-control--rectangle" data-control-id="detail-panel"><title>detail-panel</title><rect x="526" y="144" width="254" height="376" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"></rect></g><g class="balsamiq-control balsamiq-control--label" data-control-id="detail-title"><title>detail-title</title><text x="542" y="160.38" fill="#1f2937" font-family="Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="542" dy="0">CS-4821 · P1</tspan></text></g><g class="balsamiq-control balsamiq-control--label" data-control-id="account"><title>account</title><text x="542" y="194" fill="#1f2937" font-family="Arial, sans-serif" font-size="12" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="542" dy="0">Northstar Analytics</tspan><tspan x="542" dy="15">Growth plan · 84 seats</tspan></text></g><g class="balsamiq-control balsamiq-control--paragraph" data-control-id="issue"><title>issue</title><text x="542" y="240" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="542" dy="0">Retries started after key</tspan><tspan x="542" dy="17.5">rotation. Customer sees</tspan><tspan x="542" dy="17.5">duplicate delivery receipts</tspan><tspan x="542" dy="17.5">but no data loss.</tspan></text></g><g class="balsamiq-control balsamiq-control--combobox" data-control-id="assignee"><title>assignee</title><rect x="542" y="324" width="220" height="34" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"></rect><path d="M736 325 V357 M744 339 l5 5 l5 -5" fill="none" stroke="#64748b" stroke-width="1.5"></path><text x="550" y="332.25" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="550" dy="0">Assignee: Mira K.</tspan></text></g><g class="balsamiq-control balsamiq-control--textarea" data-control-id="reply"><title>reply</title><rect x="542" y="370" width="220" height="76" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"></rect><text x="550" y="378" fill="#1f2937" font-family="Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" text-anchor="start" dominant-baseline="hanging"><tspan x="550" dy="0">Draft a clear update…</tspan></text></g><g class="balsamiq-control balsamiq-control--button" data-control-id="assign"><title>assign</title><rect x="542" y="460" width="104" height="34" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"></rect><text x="594" y="468.25" fill="#111827" font-family="Arial, sans-serif" font-size="14" font-weight="500" font-style="normal" text-anchor="middle" dominant-baseline="hanging"><tspan x="594" dy="0">Take ticket</tspan></text></g><g class="balsamiq-control balsamiq-control--button" data-control-id="escalate"><title>escalate</title><rect x="654" y="460" width="108" height="34" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"></rect><text x="708" y="468.25" fill="#111827" font-family="Arial, sans-serif" font-size="14"